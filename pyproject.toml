[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kalay-ai"
version = "0.1.0"
description = "Player-centric R-NaD + NeuRD engine for imperfect-information games"
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "tier_a: frozen invariant tests (math contracts, SPEC sections 3-5)",
    "tier_b: pre-registered convergence tests (external truth anchors, SPEC section 8)",
]
